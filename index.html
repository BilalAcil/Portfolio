<!DOCTYPE html>
<html lang="en" data-lang="en" translate="no">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilal Acil • Fullstack Developer</title>
  <link rel="icon" type="image/png" href="assets/images/Bilal_Acil_Titel.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/why-me.css">
  <link rel="stylesheet" href="css/skills.css">
  <link rel="stylesheet" href="css/projects.css">
  <link rel="stylesheet" href="css/references.css">
  <link rel="stylesheet" href="css/contact.css">
  <link rel="stylesheet" href="css/privacy.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/legal.css">
  <link rel="stylesheet" href="css/responsive-1000.css">
  <link rel="stylesheet" href="css/responsive-700.css">
  <link rel="stylesheet" href="css/responsive-500.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
  <div id="p-hero"></div>
  <div id="p-navbar"></div>
  <div id="p-why-me"></div>
  <div id="p-skills"></div>
  <div id="p-projects"></div>
  <div id="p-references"></div>
  <div id="p-contact"></div>
  <div id="p-legal"></div>
  <div id="p-privacy"></div>
  <div id="p-footer"></div>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (async () => {
      const partials = [
        ['p-hero',       'partials/hero.html'],
        ['p-navbar',     'partials/navbar.html'],
        ['p-why-me',     'partials/why-me.html'],
        ['p-skills',     'partials/skills.html'],
        ['p-projects',   'partials/projects.html'],
        ['p-references', 'partials/references.html'],
        ['p-contact',    'partials/contact.html'],
        ['p-legal',      'partials/legal.html'],
        ['p-privacy',    'partials/privacy.html'],
        ['p-footer',     'partials/footer.html'],
      ];
      await Promise.all(partials.map(async ([id, file]) => {
        const res = await fetch(file);
        document.getElementById(id).innerHTML = await res.text();
      }));
      const scripts = [
        'js/utils.js', 'js/lang.js', 'js/hero.js',
        'js/projects.js', 'js/nav.js', 'js/contact.js',
        'js/legal.js', 'js/ui.js'
      ];
      for (const src of scripts) {
        await new Promise(resolve => {
          const s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          document.body.appendChild(s);
        });
      }
    })();
  </script>
</body>

</html>
